<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איתן פרטנרס</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #f7f9fa 0%, #eef2f3 100%);
    color: #1f2d3a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(31, 45, 58, 0.08);
    max-width: 560px;
    width: 100%;
    padding: 56px 40px;
    text-align: center;
  }
  .logo {
    max-width: 320px;
    width: 100%;
    height: auto;
    margin-bottom: 36px;
  }
  .tagline {
    font-size: 20px;
    line-height: 1.6;
    color: #2c3e50;
    font-weight: 500;
    margin-bottom: 44px;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: #4f7f81;
    border-radius: 2px;
    margin: 0 auto 44px;
  }
  .contacts {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .contact {
    text-align: center;
  }
  .contact-name {
    font-size: 17px;
    font-weight: 700;
    color: #1f2d3a;
    margin-bottom: 6px;
  }
  .contact-detail {
    font-size: 15px;
    color: #4a5a68;
    line-height: 1.7;
  }
  .contact-detail a {
    color: #4f7f81;
    text-decoration: none;
  }
  .contact-detail a:hover {
    text-decoration: underline;
  }
  @media (max-width: 480px) {
    .card { padding: 40px 24px; }
    .tagline { font-size: 18px; }
  }
</style>
